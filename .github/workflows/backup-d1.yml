name: Backup Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export nightplay-db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Export remote D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.45.0 d1 export nightplay-db --remote --output=nightplay-db-backup.sql
          test -s nightplay-db-backup.sql
          sha256sum nightplay-db-backup.sql | tee nightplay-db-backup.sha256

      - name: Upload database backup
        uses: actions/upload-artifact@v4
        with:
          name: nightplay-db-backup-${{ github.run_id }}
          path: |
            nightplay-db-backup.sql
            nightplay-db-backup.sha256
          if-no-files-found: error
          retention-days: 30
